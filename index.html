<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Milk Life OS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F1F3FA; --panel:#FFFFFF; --ink:#1D2233; --ink-soft:#8891A5; --line:#EBEEF5;
  --purple:#8B7FD1; --purple-deep:#5A4CC4; --purple-pale:#EEEBFB;
  --teal:#22C3A6; --teal-pale:#DFF7F1;
  --amber:#F5A623; --amber-pale:#FDEFD9;
  --coral:#FF6B8A; --coral-pale:#FFE4EA;
  --blue:#3E8DFF; --blue-pale:#E4EEFF;
  --green:#5CB85C; --green-pale:#E4F4E2; --green-deep:#3E8E3E;
  --radius:20px; --radius-sm:14px;
  --shadow-card:0 2px 6px rgba(30,41,79,.04), 0 16px 32px -20px rgba(30,41,79,.20);
  --shadow-card-hover:0 4px 10px rgba(30,41,79,.06), 0 20px 40px -18px rgba(30,41,79,.24);
  --shadow-sm:0 2px 8px rgba(30,41,79,.06);
}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:'Prompt', system-ui, sans-serif; background:var(--bg);
  color:var(--ink); display:flex; min-height:100vh; -webkit-font-smoothing:antialiased;}
h1,h2,h3,.brand{font-family:'Prompt',sans-serif;}
.mono{font-family:'JetBrains Mono', monospace;}
a{color:inherit;}

/* Sidebar — light, labeled rows (icon + text side by side) instead of an icon-only rail */
.sidebar{width:224px; background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; padding:26px 18px; gap:3px; flex-shrink:0; position:sticky; top:0; height:100vh; z-index:2;}
.brand{color:var(--ink); font-size:19px; font-weight:700; margin-bottom:26px; display:flex; align-items:center; gap:10px; letter-spacing:-0.01em;}
.brand span{display:flex; align-items:center; justify-content:center; width:36px; height:36px; border-radius:11px; background:linear-gradient(135deg,var(--purple-deep),var(--blue)); color:#fff; font-size:15px; box-shadow:0 6px 14px -6px rgba(90,76,196,.6);}
.nav-item{width:100%; height:44px; border-radius:12px; display:flex; flex-direction:row; align-items:center; justify-content:flex-start; gap:12px; color:var(--ink-soft); font-size:13.5px; font-weight:500; cursor:pointer; border:none; background:none; padding:0 12px; transition:background .15s ease, color .15s ease;}
.nav-item .icon{font-size:16px; width:22px; text-align:center; flex-shrink:0; transition:transform .15s ease;}
.nav-item.active{background:var(--purple-pale); color:var(--purple-deep); font-weight:600; box-shadow:inset 3px 0 0 0 var(--purple-deep);}
.nav-item:hover{background:var(--bg); color:var(--ink);}
.nav-spacer{height:14px;}
.profile-dot{width:38px; height:38px; border-radius:50%; background:linear-gradient(135deg,var(--teal),var(--purple)); display:flex; align-items:center; justify-content:center; color:#fff; font-weight:600; font-size:13px; cursor:pointer; box-shadow:0 4px 12px -4px rgba(0,0,0,.25); margin:14px 12px 0;}

/* Main */
.main{flex:1; padding:32px 40px 64px; max-width:1320px;}
.topbar{display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:24px; flex-wrap:wrap; gap:10px;}
.greeting h1{font-size:26px; font-weight:700; letter-spacing:-0.01em;}
.greeting p{color:var(--ink-soft); font-size:13.5px; margin-top:4px;}
.date-chip{background:var(--panel); border:1px solid var(--line); padding:9px 18px; border-radius:99px; font-size:12.5px; color:var(--ink-soft); font-weight:500; box-shadow:var(--shadow-sm);}

.ribbon{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:18px 22px; margin-bottom:22px; box-shadow:var(--shadow-card);}
.ribbon-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
.ribbon-head h3{font-size:13.5px; font-weight:600;}
.ribbon-head span{font-size:11.5px; color:var(--ink-soft);}
.timeline{position:relative; min-height:52px; display:flex; gap:24px; flex-wrap:wrap; padding-top:4px;}
.tl-item{display:flex; flex-direction:column; align-items:center; gap:6px; width:90px;}
.tl-dot{width:12px; height:12px; border-radius:50%; box-shadow:0 0 0 4px rgba(90,76,196,.08);}
.tl-label{font-size:10.5px; color:var(--ink-soft); text-align:center; line-height:1.3;}
.tl-time{font-size:9.5px; color:#A9A3C0; font-weight:600;}
.tl-empty{color:var(--ink-soft); font-size:12.5px; padding:8px 0;}

.grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px;}
@media (max-width:1050px){.grid{grid-template-columns:repeat(2,1fr);}}
.card{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:19px; display:flex; flex-direction:column; box-shadow:var(--shadow-card); transition:box-shadow .18s ease, transform .18s ease;}
.card:hover{box-shadow:var(--shadow-card-hover); transform:translateY(-2px);}
.card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; gap:8px;}
.card-title{display:flex; align-items:center; gap:10px;}
.card-icon{width:38px; height:38px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; color:#fff;}
.card-title h3{font-size:14.5px; font-weight:600;}
.card-sub{font-size:11px; color:var(--ink-soft);}
.pill{font-size:10.5px; padding:3.5px 10px; border-radius:99px; font-weight:600; white-space:nowrap;}
.icon-finance{background:linear-gradient(135deg,var(--coral),#FF8CA6); box-shadow:0 6px 14px -6px rgba(255,107,138,.55);}
.icon-run{background:linear-gradient(135deg,var(--blue),#63A6FF); box-shadow:0 6px 14px -6px rgba(62,141,255,.5);}
.icon-work{background:linear-gradient(135deg,var(--amber),#F8BC5A); box-shadow:0 6px 14px -6px rgba(245,166,35,.5);}
.icon-assets{background:linear-gradient(135deg,var(--purple-deep),#8B7FD1); box-shadow:0 6px 14px -6px rgba(90,76,196,.5);}
.icon-trip{background:linear-gradient(135deg,var(--teal),#4FDBC0); box-shadow:0 6px 14px -6px rgba(34,195,166,.5);}
.icon-capture{background:linear-gradient(135deg,var(--purple),#A79BEE); box-shadow:0 6px 14px -6px rgba(139,127,209,.5);}
.icon-settings{background:linear-gradient(135deg,var(--amber),#F8BC5A); box-shadow:0 6px 14px -6px rgba(245,166,35,.5);}
.pill-coral{background:var(--coral-pale); color:var(--coral);}
.pill-teal{background:var(--teal-pale); color:var(--teal);}
.pill-amber{background:var(--amber-pale); color:var(--amber);}
.pill-purple{background:var(--purple-pale); color:var(--purple-deep);}

.big-stat{font-size:25px; font-weight:700; margin:2px 0; letter-spacing:-0.01em;}
.stat-note{font-size:11.5px; color:var(--ink-soft); margin-bottom:12px;}

.bar-row{display:flex; align-items:center; gap:9px; margin-bottom:8px;}
.bar-label{font-size:11px; color:var(--ink-soft); width:70px; flex-shrink:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.bar-track{flex:1; height:7px; background:var(--line); border-radius:99px; overflow:hidden;}
.bar-fill{height:100%; border-radius:99px; transition:width .3s ease;}
.bar-val{font-size:10.5px; color:var(--ink-soft); width:38px; text-align:right; flex-shrink:0;}

.task-list{display:flex; flex-direction:column; gap:9px;}
.task-row{display:flex; align-items:center; gap:9px; font-size:12.5px;}
.task-check{width:17px; height:17px; border-radius:6px; border:1.5px solid var(--line); flex-shrink:0; cursor:pointer; background:none; transition:background .15s ease, border-color .15s ease;}
.task-check.done{background:var(--amber); border-color:var(--amber);}
.task-text{flex:1;}
.task-text.done{text-decoration:line-through; color:var(--ink-soft);}
.task-due{font-size:10px; color:var(--ink-soft); white-space:nowrap;}
.task-del{background:none; border:none; color:var(--ink-soft); cursor:pointer; font-size:13px; transition:color .15s ease;}
.task-del:hover{color:var(--coral);}

.trip-strip{display:flex; gap:7px; margin-top:6px; flex-wrap:wrap;}
.trip-day{flex:1; min-width:70px; background:var(--teal-pale); border-radius:12px; padding:8px 5px; text-align:center;}
.trip-day .d{font-size:9.5px; color:var(--ink-soft);}
.trip-day .place{font-size:10.5px; font-weight:600; color:var(--ink); margin-top:2px;}

.capture-box{flex:1; display:flex; flex-direction:column; gap:8px;}
.capture-row{display:flex; gap:8px;}
.capture-input{flex:1; border:1px solid var(--line); border-radius:12px; padding:10px 12px; font-size:12.5px; color:var(--ink); background:var(--bg); font-family:inherit; transition:box-shadow .15s ease, border-color .15s ease;}
.capture-input:focus{outline:none; border-color:var(--purple); box-shadow:0 0 0 3px var(--purple-pale);}
.capture-chips{display:flex; gap:6px; margin-top:2px; flex-wrap:wrap;}
.capture-chip{font-size:10.5px; padding:4px 9px; border-radius:99px; background:var(--purple-pale); color:var(--purple-deep);}

.footnote{text-align:center; color:var(--ink-soft); font-size:11.5px; margin-top:24px; line-height:1.6;}
.cal-grid{display:grid; grid-template-columns:repeat(7, 1fr); gap:4px;}
.cal-dow{text-align:center; font-size:11px; color:var(--ink-soft); padding-bottom:6px; font-weight:600;}
.cal-day{aspect-ratio:1; border-radius:14px; padding:6px 4px; display:flex; flex-direction:column; align-items:center; gap:3px; background:transparent; border:none; font-family:inherit; cursor:pointer; width:100%; transition:background .15s ease, transform .1s ease;}
.cal-day:hover{background:var(--bg); transform:translateY(-1px);}
.cal-day-out{opacity:0.3;}
.cal-day-today{background:var(--purple-pale);}
.cal-day-today .cal-day-num{color:var(--purple-deep); font-weight:700;}
.cal-day-sel{background:linear-gradient(135deg,var(--purple-deep),#7568D9); box-shadow:0 6px 14px -6px rgba(90,76,196,.55);}
.cal-day-sel .cal-day-num{color:#fff; font-weight:700;}
.cal-day-num{font-size:12px; color:var(--ink); transition:color .15s ease;}
.cal-dots{display:flex; gap:2px; min-height:6px;}
.cal-dot{width:5px; height:5px; border-radius:50%;}
.cal-day-sel .cal-dot{background:#fff !important; opacity:.85;}

/* Compact calendar — used in the "Today" overview once it's moved below the info cards */
.cal-panel-compact{max-width:620px; margin-left:auto; margin-right:auto;}
.cal-panel-compact .cal-grid{gap:3px;}
.cal-panel-compact .cal-day{padding:4px 3px; border-radius:7px; gap:2px;}
.cal-panel-compact .cal-day-num{font-size:11px;}
.cal-panel-compact .cal-dow{font-size:10px; padding-bottom:4px;}
.cal-panel-compact .cal-dot{width:4px; height:4px;}

/* Forms / buttons shared across module pages */
.section-title{font-size:20px; font-weight:700; margin-bottom:4px; letter-spacing:-0.01em;}
.section-sub{font-size:13px; color:var(--ink-soft); margin-bottom:20px;}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); padding:22px; margin-bottom:18px; box-shadow:var(--shadow-card);}
.panel h3{font-size:14.5px; font-weight:600; margin-bottom:12px;}
.form-row{display:flex; gap:9px; flex-wrap:wrap; margin-bottom:10px; align-items:center;}
.form-row input, .form-row select{border:1px solid var(--line); border-radius:10px; padding:9px 11px; font-size:12.5px; font-family:inherit; background:var(--bg); color:var(--ink); transition:box-shadow .15s ease, border-color .15s ease;}
.form-row input:focus, .form-row select:focus{outline:none; border-color:var(--purple); box-shadow:0 0 0 3px var(--purple-pale);}
.form-row input[type=text], .form-row input[type=number], .form-row input[type=date], .form-row input[type=url], .form-row input[type=month], .form-row input[type=time]{flex:1; min-width:110px;}
.btn{background:linear-gradient(135deg,var(--purple-deep),#7568D9); color:#fff; border:none; border-radius:12px; padding:9px 18px; font-size:12.5px; font-weight:600; cursor:pointer; font-family:inherit; box-shadow:0 4px 12px -6px rgba(90,76,196,.55); transition:transform .12s ease, box-shadow .12s ease, opacity .12s ease;}
.btn:hover{transform:translateY(-1px); box-shadow:0 6px 16px -6px rgba(90,76,196,.6);}
.btn:active{transform:translateY(0);}
.btn-ghost{background:var(--purple-pale); color:var(--purple-deep); box-shadow:none;}
.btn-ghost:hover{box-shadow:0 2px 8px -4px rgba(90,76,196,.3);}
.btn-teal{background:linear-gradient(135deg,var(--teal),#3FA294); box-shadow:0 4px 12px -6px rgba(79,182,166,.55);}
.btn-sm{padding:6.5px 12px; font-size:11.5px;}
.table{width:100%; border-collapse:collapse; font-size:12.5px;}
.table th{text-align:left; color:var(--ink-soft); font-weight:600; font-size:11px; padding:7px 8px; border-bottom:1px solid var(--line);}
.table td{padding:9px 8px; border-bottom:1px solid var(--line);}
.table tr:last-child td{border-bottom:none;}
.table tr:hover td{background:var(--bg);}
.muted{color:var(--ink-soft); font-size:12px;}
.msg{padding:11px 14px; border-radius:11px; font-size:12.5px; margin-bottom:12px;}
.msg-ok{background:var(--teal-pale); color:#2E6459;}
.msg-err{background:var(--coral-pale); color:#8C3532;}
.tag-row{display:flex; gap:6px; flex-wrap:wrap; margin:10px 0;}
.tag{font-size:10.5px; padding:4px 10px; border-radius:99px; background:var(--purple-pale); color:var(--purple-deep); font-weight:600;}
.two-col{display:grid; grid-template-columns:1.3fr 1fr; gap:18px;}
@media (max-width:900px){.two-col{grid-template-columns:1fr;}}
.trip-card{border:1px solid var(--line); border-radius:14px; padding:15px; margin-bottom:14px; transition:box-shadow .15s ease;}
.trip-card:hover{box-shadow:var(--shadow-sm);}
.trip-card-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.trip-card-head h4{font-size:14px; font-weight:600;}
.small-list{list-style:none; font-size:12px; color:var(--ink-soft); display:flex; flex-direction:column; gap:4px;}

/* Assets / portfolio chart */
.portfolio-chart{width:100%; height:170px; overflow:visible;}
.portfolio-chart-labels{display:flex; justify-content:space-between; font-size:10.5px; color:var(--ink-soft); margin-top:4px;}
</style>
</head>
<body>

<div class="sidebar">
  <div class="brand"><span>M</span>Life OS</div>
  <button class="nav-item" data-view="today" onclick="nav('today')"><div class="icon">◆</div>วันนี้</button>
  <button class="nav-item" data-view="finance" onclick="nav('finance')"><div class="icon">฿</div>เงิน</button>
  <button class="nav-item" data-view="running" onclick="nav('running')"><div class="icon">➤</div>กิจกรรม</button>
  <button class="nav-item" data-view="work" onclick="nav('work')"><div class="icon">▣</div>งาน</button>
  <button class="nav-item" data-view="trips" onclick="nav('trips')"><div class="icon">✈</div>ทริป</button>
  <button class="nav-item" data-view="assets" onclick="nav('assets')"><div class="icon">◎</div>ทรัพย์สิน</button>
  <div class="nav-spacer"></div>
  <button class="nav-item" data-view="settings" onclick="nav('settings')" title="Settings"><div class="icon">⚙</div>ตั้งค่า</button>
  <div class="profile-dot" title="Milk">M</div>
</div>

<div class="main">
  <div class="topbar">
    <div class="greeting">
      <h1 id="greetingText">สวัสดี, Milk</h1>
      <p>ภาพรวมทุกด้านของวันนี้ในที่เดียว</p>
    </div>
    <div class="date-chip" id="dateChip"></div>
  </div>
  <div id="viewRoot"></div>
</div>

<script>
/* ---------- State ---------- */
const LS_KEY = 'milkLifeOS_v1';
const thaiMonths = ['ม.ค.','ก.พ.','มี.ค.','เม.ย.','พ.ค.','มิ.ย.','ก.ค.','ส.ค.','ก.ย.','ต.ค.','พ.ย.','ธ.ค.'];
const thaiDays = ['อา.','จ.','อ.','พ.','พฤ.','ศ.','ส.'];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function pad2(n){ return String(n).padStart(2,'0'); }
// Local calendar date (NOT UTC) — using toISOString() here would silently shift
// the date by a day for any timezone ahead of UTC (e.g. Thailand, UTC+7),
// which is what caused activities to land on the wrong weekday in charts.
function todayISO(){ const d = new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function fmtDate(iso){ if(!iso) return ''; const d = new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return thaiDays[d.getDay()]+' '+d.getDate()+' '+thaiMonths[d.getMonth()]; }
function fmtMoney(n){ return (Number(n)||0).toLocaleString('th-TH'); }
function daysUntil(iso){ const d=new Date(iso+'T00:00:00'); const t=new Date(todayISO()+'T00:00:00'); return Math.round((d-t)/86400000); }

/* ---------- Finance history helpers ---------- */
function monthKey(dateStr){ return (dateStr||'').slice(0,7); }
function ymLabel(ym){ if(!ym) return ''; const parts = ym.split('-'); const y = parseInt(parts[0],10), m = parseInt(parts[1],10); return thaiMonths[m-1] + ' ' + (y+543); }
// Returns 42 ISO dates (6 Monday-start weeks) covering the given YYYY-MM month, for a standard month-grid calendar.
function buildMonthGrid(ym){
  const firstOfMonth = ym+'-01';
  const startDow = new Date(firstOfMonth+'T00:00:00').getDay();
  const diffToMonday = startDow === 0 ? -6 : 1 - startDow;
  const gridStart = addDays(firstOfMonth, diffToMonday);
  const days = [];
  for(let i=0;i<42;i++) days.push(addDays(gridStart, i));
  return days;
}
function shiftYM(ym, delta){ const parts = ym.split('-').map(Number); const d = new Date(parts[0], parts[1]-1+delta, 1); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0'); }
const CAT_COLORS = ['coral','purple','amber','teal'];
function categoryColor(i){ return CAT_COLORS[i % CAT_COLORS.length]; }
function monthSummary(ym){
  const txns = state.finance.transactions.filter(t=>monthKey(t.date)===ym);
  let income = 0, expense = 0; const byCat = {};
  txns.forEach(t=>{
    const amt = Number(t.amount)||0;
    if(t.type === 'income'){ income += amt; }
    else { expense += amt; const c = t.category || 'อื่นๆ'; byCat[c] = (byCat[c]||0) + amt; }
  });
  const sortedTxns = [...txns].sort((a,b)=> String(b.date).localeCompare(String(a.date)));
  const catList = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  return {ym, income, expense, net: income-expense, byCat, catList, txns: sortedTxns};
}
function lastNMonthsSummary(n){
  const set = new Set(state.finance.transactions.map(t=>monthKey(t.date)).filter(Boolean));
  set.add(financeViewYM);
  const months = [...set].sort();
  return months.slice(-n).map(ym=>monthSummary(ym));
}
function upsertTxn(tx){
  const idx = state.finance.transactions.findIndex(x=>x.id===tx.id);
  if(idx>=0){ state.finance.transactions[idx] = tx; return false; }
  state.finance.transactions.unshift(tx);
  return true;
}

/* ---------- Activities summary (always derived from activities, never synced/stored) ---------- */
function runningWeekSummary(){
  const days = currentWeekMondayToSunday();
  const set = new Set(days);
  const weekActivities = state.running.activities.filter(a=>set.has(a.date));
  const weekKm = weekActivities.reduce((s,a)=>s+(a.distance_km||0),0);
  const goal = state.running.weeklyGoalKm || 0;
  const pct = goal ? Math.min(100, Math.round(100*weekKm/goal)) : 0;
  return { weekKm, goal, pct, weekActivities };
}

/* ---------- Activity types (used to color the bar/donut charts) ---------- */
const ACTIVITY_TYPES = [
  {key:'run_road', label:'วิ่งถนน', color:'var(--teal)'},
  {key:'run_trail', label:'วิ่งเทรล', color:'var(--green)'},
  {key:'run_treadmill', label:'วิ่งลู่', color:'var(--purple)'},
  {key:'ride', label:'ปั่นจักรยาน', color:'var(--blue)'},
  {key:'weights', label:'เวทเทรนนิ่ง', color:'var(--amber)'},
  {key:'other', label:'อื่นๆ', color:'var(--coral)'}
];
function activityTypeMeta(key){ return ACTIVITY_TYPES.find(t=>t.key===key) || ACTIVITY_TYPES.find(t=>t.key==='other'); }
// A single "how much did this session count for" number used only to size chart
// bars — real distance (km) for distance-based activities, otherwise minutes/10
// as a rough stand-in so a gym session still shows up as a visible bar.
function activityScore(a){
  const km = Number(a.distance_km)||0;
  if(km>0) return km;
  const min = Number(a.moving_time_min)||0;
  if(min>0) return min/10;
  return 1;
}
function activitiesOn(dateIso){ return state.running.activities.filter(a=>a.date===dateIso); }
// One bucket per day of the given Monday-start week, each broken down by activity type.
function buildWeeklyActivityBuckets(weekDays){
  return weekDays.map((d,i)=>{
    const acts = activitiesOn(d);
    const byType = {}; ACTIVITY_TYPES.forEach(t=>byType[t.key]=0);
    acts.forEach(a=>{ byType[a.type||'other'] += activityScore(a); });
    const total = Object.values(byType).reduce((s,v)=>s+v,0);
    return { label: weekdayShort[i], date: d, byType, total, count: acts.length };
  });
}
// One bucket per calendar month, most recent n months (oldest first).
function buildMonthlyActivityBuckets(n){
  const months = [];
  let ym = todayISO().slice(0,7);
  for(let i=0;i<n;i++){ months.unshift(ym); ym = shiftYM(ym,-1); }
  return months.map(ym=>{
    const acts = state.running.activities.filter(a=>monthKey(a.date)===ym);
    const byType = {}; ACTIVITY_TYPES.forEach(t=>byType[t.key]=0);
    acts.forEach(a=>{ byType[a.type||'other'] += activityScore(a); });
    const total = Object.values(byType).reduce((s,v)=>s+v,0);
    return { label: ymLabel(ym).split(' ')[0], date: ym, byType, total, count: acts.length };
  });
}
function activityTypeCounts(activities){
  return ACTIVITY_TYPES.map(t=>({ ...t, count: activities.filter(a=>(a.type||'other')===t.key).length }));
}
// Stacked vertical bar chart — plain flex/div bars (no chart lib), colored by activity type.
function renderActivityBarChart(buckets){
  const maxTotal = Math.max(1, ...buckets.map(b=>b.total));
  return `
  <div style="display:flex; align-items:flex-end; gap:10px; height:150px; padding-top:6px">

// Donut chart via conic-gradient — no SVG/canvas needed.
function renderActivityDonut(activities){
  const counts = activityTypeCounts(activities);
  const total = counts.reduce((s,c)=>s+c.count,0);
  if(!total) return '<div class="muted">ยังไม่มีข้อมูลกิจกรรมช่วงนี้</div>';
  let acc = 0;
  const stops = counts.filter(c=>c.count>0).map(c=>{
    const start = acc/total*360; acc += c.count; const end = acc/total*360;

// Best-known value of one item as of a given date, from its valueHistory —
// used to reconstruct a net-worth-over-time line without any live market feed.
function itemValueAsOf(item, dateIso){
  const hist = (item.valueHistory||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  // Dime-sourced items are gated to the fixed DIME_ITEM_TRACKING_START cutover, not to
  // whatever their own earliest valueHistory entry happens to be. Some holdings (IVV, QQQM,
  // VEA) now carry real pre-cutover history points (Mar/Apr 2026) purely for their own
  // per-item detail chart (see the modal in renderAssets) — but that pre-cutover period is
  // already fully represented by the monthly Dime report snapshots (see reportValueAsOf), so
  // itemsTotalAsOf must contribute exactly 0 for Dime items before the cutover regardless of
  // how much valueHistory they have, or that money gets counted twice. Non-Dime items (savings,
  // condo, ฯลฯ) aren't covered by any report and keep the old "value was probably similar a
  // bit earlier" fallback to their earliest known value.
  if(item.dimeSourced && dateIso < DIME_ITEM_TRACKING_START) return 0;
  if(!hist.length) return Number(item.value)||0;
  const onOrBefore = hist.filter(h=>h.date<=dateIso);
  if(onOrBefore.length) return onOrBefore[onOrBefore.length-1].value;
  return hist[0].value; // use the earliest we have
}
function itemsTotalAsOf(dateIso){ return state.assets.items.reduce((s,it)=>s+itemValueAsOf(it,dateIso),0); }
function reportValueAsOf(dateIso){
  // From DIME_ITEM_TRACKING_START onward, Dime holdings are tracked at item granularity
  // (see itemValueAsOf/itemsTotalAsOf) — the monthly report total would just be the same
  // money counted a second time, so it no longer contributes past that cutover.
  if(dateIso >= DIME_ITEM_TRACKING_START) return 0;
  const ym = dateIso.slice(0,7);
  const r = assetsSortedReports().filter(r=>r.month<=ym);
  return r.length ? r[r.length-1].totalValue : 0;
}
// Reconstructed total net worth (items + Dime portion − debts) as of any date, used to plot
// the portfolio line chart. Debts aren't tracked historically, so today's debt total is used
// as a flat offset across the whole series (best available approximation, no live data source).
function assetsValueAt(dateIso){ return itemsTotalAsOf(dateIso) + reportValueAsOf(dateIso) - assetsDebtsTotal(); }

// All distinct dates we have any snapshot for (Dime monthly reports + every item's valueHistory),
// filtered down to the requested period window.
function assetsChartDates(mode){
  const set = new Set();
  assetsSortedReports().forEach(r=> set.add(r.month+'-01'));
  state.assets.items.forEach(it=> (it.valueHistory||[]).forEach(h=> set.add(h.date)));
  let dates = [...set].sort();
  const today = todayISO();
  if(mode==='daily') dates = dates.filter(d=>d>=addDays(today,-30));
  else if(mode==='monthly') dates = dates.filter(d=>d>=addDays(today,-365));
  else if(mode==='yearly') dates = dates.filter(d=>d>=addDays(today,-365*5));
  // 'all' — no window filter, use everything we have.
  return dates;
}
function assetsChartSeries(mode){ return assetsChartDates(mode).map(d=>({date:d, value: assetsValueAt(d)})); }

// Tiny inline sparkline (no axes/gridlines) for one holding's own valueHistory.
function renderSparkline(valueHistory){
  const h = (valueHistory||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(h.length < 2) return '<span class="muted" style="font-size:10px">—</span>';
  const W=72, H=26, pad=2;
  const values = h.map(x=>x.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max-min) || Math.max(1, max*0.1) || 1;
  const stepX = (W-2*pad)/(h.length-1);
  const pts = h.map((p,i)=>{ const x=pad+i*stepX; const y=H-pad-((p.value-min)/range)*(H-2*pad); return x.toFixed(1)+','+y.toFixed(1); }).join(' ');
  const color = values[values.length-1] >= values[0] ? 'var(--teal)' : 'var(--coral)';
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="display:block"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

/* ---------- Direct same-origin read from Milk Hub ----------
   Milk Hub (milkhub:*) and Life OS share a browser's localStorage automatically
   IF AND ONLY IF they are served from the exact same origin (scheme+host+port) —
   e.g. both under https://milktanawat-dot.github.io/... — because localStorage is
   scoped per-origin, not per-path. Opened as a local file, or from any other host,
   this simply finds nothing and the manual JSON-import panel is used instead. */
function milkHubSameOriginAvailable(){
  try{ return localStorage.getItem('milkhub:app:profiles') !== null; }catch(e){ return false; }
}
function syncFromMilkHubDirect(){
  try{
    const profilesRaw = localStorage.getItem('milkhub:app:profiles');
    if(!profilesRaw) return null;
    const profiles = JSON.parse(profilesRaw) || [];
    // Real same-origin connection confirmed. Drop the built-in sample/demo
    // transactions so they don't sit mixed in with real Milk Hub data. This also
    // covers browsers that already saved a demo-seeded state before this fix
    // shipped (those old rows predate the `demo` flag) — if nothing in the
    // current ledger has ever come from a real Milk Hub sync (no 'mh-' ids yet),
    // treat the whole ledger as leftover demo data and clear it before merging.
    const hasRealSyncedRows = state.finance.transactions.some(t=>t.id && String(t.id).indexOf('mh-')===0);
    state.finance.transactions = hasRealSyncedRows
      ? state.finance.transactions.filter(t=>!t.demo)
      : [];
    let processed = 0;
    profiles.forEach(p=>{
      const key = p.id === 'default' ? 'milkhub:money:entries' : 'milkhub:profile:' + p.id + ':money:entries';
      const raw = localStorage.getItem(key);
      if(!raw) return;
      let money; try{ money = JSON.parse(raw); }catch(e){ return; }
      (money||[]).forEach(tx=>{
        if(!tx.amount) return;
        upsertTxn({
          id: 'mh-' + (profiles.length>1?p.id+'-':'') + (tx.id || uid()),
          date: (tx.date || todayISO()).slice(0,10),
          type: tx.type === 'income' ? 'income' : 'expense',
          category: tx.category || 'อื่นๆ',
          item: tx.item || '',
          amount: Number(tx.amount) || 0,
          profile: profiles.length>1 ? (p.name||p.id) : undefined
        });
        processed++;
      });
    });
    state.finance.lastImport = new Date().toISOString();
    state.finance.lastImportMode = 'same-origin';
    saveState();
    return processed;
  }catch(e){ return null; }
}

let state = loadState();
function loadState(){
  const raw = localStorage.getItem(LS_KEY);
  if(raw){
    try{
      const s = JSON.parse(raw);
      // Backfill fields added in later versions so people with an older saved
      // state (from before this update) don't hit "undefined" errors.
      if(s.work && !s.work.routines) s.work.routines = [];
      if(s.work && !s.work.routineCompletions) s.work.routineCompletions = {};
      if(!s.calendar) s.calendar = {events:[]};
      if(!s.calendar.events) s.calendar.events = [];
      if(!s.assets) s.assets = {items:[], reports:[]};
      if(!s.assets.items) s.assets.items = [];
      if(!s.assets.reports) s.assets.reports = [];
      if(!s.assets.debts) s.assets.debts = [];
      if(!s.settings) s.settings = {};
      if(s.settings.finnhubApiKey == null) s.settings.finnhubApiKey = '';
      // Backfill currency on items saved before live market-price tracking existed — don't
      // guess symbol/units for pre-existing non-Dime items, they just aren't eligible for
      // live refresh until the user (or a later Dime import) sets those explicitly.
      (s.assets.items||[]).forEach(it=>{ if(it.currency == null) it.currency = 'THB'; });
      // Backfill items saved before confirmation-note transaction history existed.
      (s.assets.items||[]).forEach(it=>{ if(!it.transactions) it.transactions = []; });
      // Backfill items saved before category/costBasis/valueHistory existed. Old free-text
      // category values (เงินสด/หุ้น-กองทุน/ฯลฯ) are kept in assetType and mapped onto the
      // new core/satellite/bond/cash/other taxonomy so the category donut still works.
      (function(){
        const legacyCategoryMap = {'เงินสด':'cash','หุ้น/กองทุน':'core','คริปโต':'satellite','อสังหาริมทรัพย์':'other','ทองคำ':'other','อื่นๆ':'other'};
        const validKeys = ASSET_CATEGORIES.map(c=>c.key);
        (s.assets.items||[]).forEach(it=>{
          if(!it.category || validKeys.indexOf(it.category)===-1){
            if(it.assetType == null) it.assetType = it.category || '';
            it.category = legacyCategoryMap[it.category] || 'other';
          }
          if(it.costBasis == null) it.costBasis = 0;
          if(!it.valueHistory) it.valueHistory = [{date: it.updated || todayISO(), value: Number(it.value)||0}];
        });
      })();
      // One-time seed of real Dime portfolio data (parsed from the user's own Dime monthly
      // statement PDFs, offshore account holdings as of 31 Jul 2026, THB @ that day's BOT rate
      // of 33.25/USD, plus combined offshore+Thai net-worth snapshots for Mar/Apr/Jul 2026 —
      // May/Jun statements weren't available for the main account so those months are skipped
      // rather than shown as a misleading dip). Runs once per browser via the dimeImportV1 flag;
      // items land in the normal editable/deletable assets.items list afterwards like any other
      // holding, so nothing here is special-cased beyond this one seed.
      if(!s.assets.dimeImportV1){
        const seed = dimeImportSeed();
        s.assets.items.push(...seed.items);
        seed.reports.forEach(rep=>{
          const idx = s.assets.reports.findIndex(r=>r.month===rep.month);
          if(idx>=0) s.assets.reports[idx] = rep; else s.assets.reports.push(rep);
        });
        s.assets.dimeImportV1 = true;
        // Persist immediately (unlike the rest of this function, which only mutates the
        // in-memory copy) so the seed survives even if the user closes the tab before any
        // other action would have called saveState() — otherwise it'd silently re-derive
        // in memory on every load without ever landing in localStorage.
        try{ localStorage.setItem(LS_KEY, JSON.stringify(s)); }catch(e){}
      }
      if(s.running){
        // Older saves had static weekKm/weekLabel/goalNote fields that were never
        // recomputed — the "Today" card now always derives these from activities,
        // so the stale fields are just dropped (weeklyGoalKm is kept — that one's
        // meant to be hand-set).
        delete s.running.weekKm; delete s.running.weekLabel; delete s.running.goalNote;
        if(s.running.weeklyGoalKm == null) s.running.weeklyGoalKm = 40;
        // Older saves predate activity types — guess run vs. other from whether it has a distance.
        // Also backfill the old flat 'run' type (pre road/trail/treadmill split) to 'run_road'
        // so it keeps the original teal color and doesn't fall through to activityTypeMeta's
        // 'other' fallback.
        (s.running.activities||[]).forEach(a=>{
          if(!a.type) a.type = (Number(a.distance_km)>0) ? 'run_road' : 'other';
          else if(a.type === 'run') a.type = 'run_road';
        });
      }
      delete s.health; // module removed — family health tracking is gone from this build
      return s;
    }catch(e){ console.warn('bad state, resetting'); }
  }
  const s = defaultState();
  localStorage.setItem(LS_KEY, JSON.stringify(s));
  return s;
}
function saveState(){ localStorage.setItem(LS_KEY, JSON.stringify(state)); }

/* ---------- Quick capture parser ---------- */
function parseCapture(text){
  const segments = text.split(/[,\n]/).map(s=>s.trim()).filter(Boolean);
  const results = [];
  segments.forEach(seg=>{
    const numMatch = seg.match(/(\d+(?:\.\d+)?)/);
    const num = numMatch ? parseFloat(numMatch[1]) : null;
    if(/กม|km|วิ่ง|ว่าย|ปั่น/i.test(seg) && num !== null){
      const type = /ปั่น|ride|bike/i.test(seg) ? 'ride'
        : /เทรล|trail/i.test(seg) ? 'run_trail'
        : /ลู่|treadmill/i.test(seg) ? 'run_treadmill'
        : 'run_road';
      state.running.activities.unshift({id:uid(), date:todayISO(), name:seg, distance_km:num, moving_time_min:null, done:true, type});
      results.push('→ Log กิจกรรม ' + num + 'K: "' + seg + '"');
    } else if(/บาท|฿/.test(seg) && num !== null){
      const isIncome = /รับ:|เงินเดือน|โบนัส/.test(seg);
      state.finance.transactions.unshift({id:uid(), date:todayISO(), type: isIncome?'income':'expense', category: isIncome?'รายรับ':'อื่นๆ', item:seg, amount:num});
      results.push('→ ' + (isIncome?'รายรับ':'รายจ่าย') + ' ฿' + fmtMoney(num) + ': "' + seg + '"');
    } else {
      const timeMatch = seg.match(/(\d{1,2}):(\d{2})/);
      state.work.tasks.unshift({id:uid(), text:seg, due: todayISO() + (timeMatch ? ' ' + timeMatch[0] : ''), done:false, priority:'normal'});
      results.push('→ Task: "' + seg + '"' + (timeMatch ? ' เวลา ' + timeMatch[0] : ''));
    }
  });
  saveState();
  return results;
}

function importFinanceJson(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const data = JSON.parse(reader.result);
      let processed = 0;
      const profiles = data.profiles || [];
      const allData = data.allProfileData || null;
      const profileName = (id)=>{ const p = profiles.find(x=>x.id===id); return p ? (p.name||p.id) : null; };
      const mapTxn = (tx, pid)=>({
        id: 'mh-' + (pid?pid+'-':'') + (tx.id || uid()),
        date: (tx.date || todayISO()).slice(0,10),
        type: tx.type === 'income' ? 'income' : 'expense',
        category: tx.category || 'อื่นๆ',
        item: tx.item || '',
        amount: Number(tx.amount) || 0,
        profile: pid ? (profileName(pid) || undefined) : undefined
      });
      if(allData && Object.keys(allData).length){
        Object.keys(allData).forEach(pid=>{
          const money = (allData[pid] && allData[pid].money) || [];
          money.forEach(tx=>{ if(!tx.amount) return; upsertTxn(mapTxn(tx, profiles.length>1 ? pid : null)); processed++; });
        });
      } else {
        const list = data.money || (Array.isArray(data) ? data : []);
        list.forEach(tx=>{ if(!tx.amount) return; upsertTxn(mapTxn(tx, null)); processed++; });
      }
      state.finance.lastImport = new Date().toISOString();
      document.getElementById('financeImportMsg').innerHTML = `<div class="msg msg-ok">Import สำเร็จ — ประมวลผล ${processed} รายการ${profiles.length>1 ? (' จาก ' + profiles.length + ' โปรไฟล์') : ''}</div>`;
      saveState(); render();
    }catch(e){
      document.getElementById('financeImportMsg').innerHTML = `<div class="msg msg-err">อ่านไฟล์ไม่ได้ — ตรวจสอบว่าเป็นไฟล์ backup JSON จาก Milk Hub (ปุ่ม "ดาวน์โหลด Backup (JSON)" ในหน้าตั้งค่าของ Milk Hub) ข้อผิดพลาด: ${escapeHtml(e.message)}</div>`;
    }
  };
  reader.readAsText(file);
}

// Monday-start week range containing the given ISO date (defaults to today).
function currentWeekMondayToSunday(baseIso){
  const base = baseIso || todayISO();
  const d = new Date(base+'T00:00:00');
  const dow = d.getDay(); // 0=Sun..6=Sat
  const diffToMonday = dow === 0 ? -6 : 1 - dow;
  const monday = addDays(base, diffToMonday);
  const days = [];
  for(let i=0;i<7;i++) days.push(addDays(monday, i));
  return days; // [Mon, Tue, Wed, Thu, Fri, Sat, Sun]
}

// intervals.icu (and Strava, which it mirrors) use type strings like "Run",
// "Ride", "VirtualRide", "WeightTraining", "Workout" — map those down to our
// four chart categories.
function mapIntervalsType(t){
  t = String(t||'').toLowerCase();
  if(t.includes('treadmill')) return 'run_treadmill';
  if(t.includes('trail')) return 'run_trail';
  if(t.includes('run')) return 'run_road';
  if(t.includes('ride') || t.includes('bike') || t.includes('cycl')) return 'ride';
  if(t.includes('weight') || t.includes('strength')) return 'weights';
  return 'other';
}
async function syncIntervals(){
  const msgEl = document.getElementById('runSyncMsg');
  const key = state.settings.intervalsApiKey;
  const athlete = state.settings.intervalsAthleteId || '0';
  if(!key){ msgEl.innerHTML = `<div class="msg msg-err">ยังไม่ได้ใส่ API key — ไปที่หน้า "ตั้งค่า" ก่อน</div>`; return; }
  msgEl.innerHTML = `<div class="muted">กำลัง sync...</div>`;
  const newest = todayISO();
  const oldest = addDays(newest, -13);
  const url = `https://intervals.icu/api/v1/athlete/${athlete}/activities?oldest=${oldest}&newest=${newest}`;
  try{
    const res = await fetch(url, { headers: { 'Authorization': 'Basic ' + btoa('API_KEY:' + key) } });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();

    // Real intervals.icu connection confirmed. Drop the built-in sample/demo
    // runs so they don't sit mixed in with real data — same pattern used for
    // Milk Hub finance sync. Also covers browsers that saved a demo-seeded
    // state before this fix shipped: if nothing in the current list has ever
    // come from a real sync (no 'intervals-' id yet), treat the whole list as
    // leftover demo data and clear it before merging.
    const hasRealSyncedRuns = state.running.activities.some(a=>a.id && String(a.id).indexOf('intervals-')===0);
    state.running.activities = hasRealSyncedRuns
      ? state.running.activities.filter(a=>!a.demo)
      : [];

    // Dedupe: intervals.icu returns the same activities every time the date
    // range overlaps a previous sync, so only add ids we haven't seen yet —
    // otherwise every "Sync ตอนนี้" click doubled up the list.
    const existingIds = new Set(state.running.activities.map(a=>a.id));
    let added = 0, skipped = 0;
    (data||[]).forEach(act=>{
      const km = (act.distance || 0) / 1000;
      const minutes = act.moving_time ? Math.round(act.moving_time/60) : 0;
      if(!km && !minutes) return; // nothing usable to chart — skip
      const id = 'intervals-' + act.id;
      if(existingIds.has(id)){ skipped++; return; }
      state.running.activities.unshift({
        id,
        date: (act.start_date_local||act.start_date||todayISO()).slice(0,10),
        name: act.name || act.type || 'Activity',
        distance_km: km ? Math.round(km*10)/10 : 0,
        moving_time_min: minutes || null,
        type: mapIntervalsType(act.type),
        done:true
      });
      existingIds.add(id);
      added++;
    });
    state.running.lastSync = new Date().toISOString();
    saveState();
    msgEl.innerHTML = `<div class="msg msg-ok">Sync สำเร็จ — เพิ่มใหม่ ${added} กิจกรรม${skipped ? ` (ข้าม ${skipped} รายการที่มีอยู่แล้ว)` : ''}</div>`;
    render();
  }catch(err){
    msgEl.innerHTML = `<div class="msg msg-err">Sync ไม่สำเร็จ (${escapeHtml(err.message)}). สาเหตุที่พบบ่อย: เบราว์เซอร์บล็อกด้วย CORS เพราะไฟล์นี้เปิดแบบ local file, หรือ API key/athlete id ไม่ถูกต้อง — ลองเปิดไฟล์นี้ผ่าน local web server (เช่น "npx serve") แทนการดับเบิลคลิกเปิดตรงๆ ถ้ายังไม่ได้ ให้ใช้ปุ่ม "บันทึกเอง" แทนไปก่อน</div>`;
  }
}

function delRoutine(id){

function gcalLink(date, title){
  const start = date.replace(/-/g,'');
  const end = addDays(date,1).replace(/-/g,'');
  const text = encodeURIComponent(title || 'กิจกรรม');
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${text}&dates=${start}/${end}`;
}

function updateTripDay(tripId, idx, field, value){ const tr = state.trips.list.find(t=>t.id===tripId); if(tr && tr.days[idx]){ tr.days[idx][field] = value; saveState(); } }
function addTripExpense(tripId){

// Small inline SVG line+area chart — same hand-authored technique for all Assets-module
// line charts (linearGradient area fill + polyline path), now generalized to take any
// {date, value} series so it can plot the daily/monthly/yearly/all-time portfolio views.
// Shared SVG-with-gradient-fill line chart geometry — used by both the main portfolio
// chart (renderAssetsLineChart) and the per-holding detail chart (renderItemLineChart) so
// there's exactly one charting technique in the app, not two.
function buildLineChartSvg(series, opts){
  opts = opts || {};
  const W = opts.W || 640, H = opts.H || 170, pad = opts.pad || 22;
  const gradId = opts.gradId || 'assetsGrad';
  const values = series.map(p=>p.value);
  const min = Math.min(...values), max = Math.max(...values);
  const range = (max - min) || Math.max(1, max*0.1) || 1;
  const stepX = series.length>1 ? (W - 2*pad) / (series.length - 1) : 0;
  const pts = series.map((p,i)=>{
    const x = series.length>1 ? pad + i*stepX : W/2;
    const y = H - pad - ((p.value - min)/range)*(H - 2*pad);
    return {x, y, p};
  });
  const path = pts.map((pt,i)=>(i===0?'M':'L')+pt.x.toFixed(1)+','+pt.y.toFixed(1)).join(' ');
  const areaPath = path + ` L${pts[pts.length-1].x.toFixed(1)},${H-pad} L${pts[0].x.toFixed(1)},${H-pad} Z`;
  const svg = `
  <svg class="portfolio-chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">
    <defs>
      <linearGradient id="${gradId}" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" style="stop-color:var(--purple); stop-opacity:0.30"/>
        <stop offset="100%" style="stop-color:var(--purple); stop-opacity:0"/>
      </linearGradient>
    </defs>
    <path d="${areaPath}" fill="url(#${gradId})" stroke="none"></path>
    <path d="${path}" fill="none" stroke="var(--purple-deep)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path>
    ${pts.map(pt=>`<circle cx="${pt.x.toFixed(1)}" cy="${pt.y.toFixed(1)}" r="3.5" fill="var(--purple-deep)" stroke="#fff" stroke-width="1.5"></circle>`).join('')}
  </svg>`;
  return {svg, pts};
}
function renderAssetsLineChart(series, mode){
  if(series.length < 2) return `<div class="muted" style="padding:36px 0; text-align:center">ยังไม่มีข้อมูลเพียงพอสำหรับช่วงนี้</div>`;
  const labelFor = (d)=>{
    if(mode==='daily') return d.slice(5);
    if(mode==='yearly') return String(parseInt(d.slice(0,4),10)+543);
    return ymLabel(d.slice(0,7)).split(' ')[0] + " '" + String(parseInt(d.slice(0,4),10)+543).slice(-2);
  };
  const {svg, pts} = buildLineChartSvg(series, {gradId:'assetsGrad'});
  const labelStep = Math.max(1, Math.ceil(pts.length/8));
  return `
  ${svg}
  <div class="portfolio-chart-labels">${pts.filter((_,i)=>i%labelStep===0||i===pts.length-1).map(pt=>`<span>${labelFor(pt.p.date)}</span>`).join('')}</div>
  `;
}
// Builds small buy/sell tick markers for an item's confirmation-note transactions, placed
// along the SAME x-axis coordinate system buildLineChartSvg already established for the
// valueHistory `pts` (interpolated by date between the chart's own points, not a second
// independent coordinate system). Green/teal for buy, coral for sell, per the app's
// existing gain/loss semantic colors.
function buildTxnMarkersSvg(item, pts, W, H, pad){
  const txns = (item.transactions||[]).filter(t=>t.date);
  if(!txns.length || pts.length<2) return '';
  const t0 = new Date(pts[0].p.date+'T00:00:00').getTime();
  const t1 = new Date(pts[pts.length-1].p.date+'T00:00:00').getTime();
  const xForDate = (d)=>{
    const t = new Date(d+'T00:00:00').getTime();
    if(!(t1>t0)) return pts[0].x;
    const frac = Math.max(0, Math.min(1, (t-t0)/(t1-t0)));
    return pad + frac*(W-2*pad);
  };
  const y = H-3;
  return txns.map(tx=>{
    const x = xForDate(tx.date);
    const color = tx.side==='sell' ? 'var(--coral)' : 'var(--teal)';
    return `<circle cx="${x.toFixed(1)}" cy="${y}" r="3" fill="${color}" stroke="#fff" stroke-width="1"><title>${tx.side==='sell'?'ขาย':'ซื้อ'} ${tx.units} @ $${tx.price} (${fmtDate(tx.date)})</title></circle>`;
  }).join('');
}
// Per-holding detail chart shown in the item chart modal (see openItemChart). Plots the
// item's own valueHistory directly with no DIME_ITEM_TRACKING_START gating — that gating
// only applies to the portfolio-total math (itemValueAsOf/itemsTotalAsOf), not to what a
// single item's own history looked like. When the item has confirmation-note transactions,
// small buy/sell markers are overlaid along the x-axis (see buildTxnMarkersSvg).
function renderItemLineChart(item){
  const hist = (item.valueHistory||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(!hist.length) return `<div class="muted" style="padding:36px 0; text-align:center">ยังไม่มีข้อมูลมูลค่าสำหรับรายการนี้</div>`;
  if(hist.length < 2){
    return `<div class="muted" style="padding:24px 0; text-align:center">มีข้อมูลจุดเดียว — อัพเดทมูลค่าเพิ่มเพื่อดูแนวโน้ม<div class="mono" style="font-size:20px; font-weight:700; color:var(--ink); margin-top:10px">฿${fmtMoney(hist[0].value)}</div><div class="muted" style="margin-top:2px">${fmtDate(hist[0].date)}</div></div>`;
  }
  const series = hist.map(h=>({date:h.date, value:h.value}));
  const W = 640, H = 170, pad = 22;
  const {svg, pts} = buildLineChartSvg(series, {gradId:'itemChartGrad', W, H, pad});
  const markers = buildTxnMarkersSvg(item, pts, W, H, pad);
  const svgWithMarkers = markers ? svg.replace('</svg>', markers + '</svg>') : svg;
  return `
  ${svgWithMarkers}
  <div class="portfolio-chart-labels">${pts.map(pt=>`<span>${fmtDate(pt.p.date)}</span>`).join('')}</div>
  <div class="portfolio-chart-labels" style="margin-top:2px">${pts.map(pt=>`<span class="mono" style="font-weight:600; color:var(--ink)">฿${fmtMoney(pt.p.value)}</span>`).join('')}</div>
  ${markers ? `<div class="muted" style="margin-top:6px; font-size:11px"><span style="color:var(--teal)">●</span> ซื้อ &nbsp; <span style="color:var(--coral)">●</span> ขาย — จากใบยืนยันการซื้อขาย</div>` : ''}
  `;
}
// Compact transaction table + weighted-average-cost cross-check shown below the per-item
// chart in the modal. Deliberately does NOT try to reconcile confirmation-note units against
// the item's actual held units if they don't match — see the caveat on
// DIME_CONFIRMATION_NOTE_TXNS_RAW for why that gap is real and expected, not a bug.
function renderItemTransactionsBlock(item){
  const txns = (item.transactions||[]).slice().sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  if(!txns.length) return '';
  const buys = txns.filter(t=>t.side==='buy');
  const sumUnits = buys.reduce((s,t)=>s+(Number(t.units)||0),0);
  const sumCost = buys.reduce((s,t)=>s+(Number(t.units)||0)*(Number(t.price)||0),0);
  const wavgUsd = sumUnits ? sumCost/sumUnits : null;
  const stmtAvgThb = (item.units>0) ? (Number(item.costBasis)||0)/item.units : null;
  const unitsGapNote = (sumUnits && item.units && Math.abs(sumUnits-item.units)>0.0005)
    ? `<div style="font-size:11px; margin-top:4px">หมายเหตุ: ใบยืนยันที่มีไม่ครบทุกรายการซื้อ (${sumUnits.toFixed(4)} หน่วยจากใบยืนยัน เทียบกับ ${item.units} หน่วยที่ถือครองจริง) — อาจมีการซื้อผ่านช่องทางอื่น เช่น auto-invest หรืออีเมลบางฉบับไม่อยู่ในชุดที่นำเข้า ตัวเลขทั้งสองแสดงไว้ตรงๆ ไม่พยายามปรับให้ตรงกัน</div>`
    : '';
  return `
  <div style="margin-top:18px">
    <h3 style="font-size:13px; margin-bottom:8px">ประวัติการซื้อขายจากใบยืนยัน (${txns.length} รายการ)</h3>
    <table class="table">
      <tr><th>วันที่</th><th>ฝั่ง</th><th style="text-align:right">จำนวนหน่วย</th><th style="text-align:right">ราคา (USD)</th><th style="text-align:right">รวม (THB)</th></tr>
      ${txns.map(t=>`<tr>
        <td class="mono">${fmtDate(t.date)}</td>
        <td><span class="tag" style="background:${t.side==='buy'?'var(--teal-pale)':'var(--coral-pale)'}; color:${t.side==='buy'?'var(--teal)':'var(--coral)'}">${t.side==='buy'?'ซื้อ':'ขาย'}</span></td>
        <td style="text-align:right" class="mono">${t.units}</td>
        <td style="text-align:right" class="mono">$${t.price}</td>
        <td style="text-align:right" class="mono">฿${fmtMoney(t.totalTHB)}</td>
      </tr>`).join('')}
    </table>
    <div class="muted" style="margin-top:8px">
      ต้นทุนเฉลี่ยจากใบยืนยัน (USD/หน่วย): <b>${wavgUsd!=null ? '$'+wavgUsd.toFixed(2) : '—'}</b>
      ${stmtAvgThb!=null ? ` &nbsp;|&nbsp; ต้นทุนเฉลี่ยจากรายงานพอร์ต (THB/หน่วย): <b>฿${stmtAvgThb.toFixed(2)}</b>` : ''}
      ${unitsGapNote}
    </div>
  </div>`;
}

// Lazily loads pdf.js from cdnjs the first time a PDF is imported, so the base
// app stays dependency-free until this feature is actually used.
let pdfjsLoadPromise = null;
function ensurePdfJs(){
  if(window.pdfjsLib) return Promise.resolve();
  if(pdfjsLoadPromise) return pdfjsLoadPromise;
  pdfjsLoadPromise = new Promise((resolve, reject)=>{
    const s = document.createElement('script');
    s.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    s.onload = ()=>{
      window.pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
      resolve();
    };
    s.onerror = ()=>reject(new Error('โหลดตัวอ่าน PDF จาก cdnjs ไม่สำเร็จ — เช็คอินเทอร์เน็ต'));
    document.head.appendChild(s);
  });
  return pdfjsLoadPromise;
}
let dimeParseSucceeded = false;
async function handleDimePdf(evt){
  const file = evt.target.files[0];
  const msgEl = document.getElementById('dimeImportMsg');
  dimeParseSucceeded = false;
  if(!file) return;
  msgEl.innerHTML = '<span class="muted">กำลังอ่านไฟล์...</span>';
  try{
    await ensurePdfJs();
    const buf = await file.arrayBuffer();
    const pdf = await window.pdfjsLib.getDocument({data:buf}).promise;
    let text = '';
    for(let i=1;i<=pdf.numPages;i++){
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(it=>it.str).join(' ') + '\n';
    }
    const guess = guessPortfolioValue(text);
    if(guess != null){
      document.getElementById('dimeValue').value = guess;
      dimeParseSucceeded = true;
      msgEl.innerHTML = `<span style="color:var(--teal)">อ่านไฟล์สำเร็จ — เดามูลค่ารวมได้ ฿${fmtMoney(guess)}. ตรวจเลขในช่องด้านล่างก่อนกดบันทึกเสมอ เผื่อรูปแบบรายงานเปลี่ยนไปจากที่เดาไว้</span>`;
    } else {
      msgEl.innerHTML = `<span style="color:var(--amber)">อ่านไฟล์ได้ (${pdf.numPages} หน้า) แต่หา "มูลค่ารวม" ในเนื้อหาไม่เจอ — กรอกตัวเลขในช่องด้านล่างเองได้เลย</span>`;
    }
  }catch(err){
    msgEl.innerHTML = `<span style="color:var(--coral)">อ่านไฟล์ไม่สำเร็จ: ${escapeHtml(err.message)} — กรอกมูลค่าด้วยมือแทนได้</span>`;
  }
}
// Heuristic only — Dime's exact PDF layout isn't known, so this looks for a
// labelled total near common Thai/English keywords first, then falls back to
// the largest currency-looking number on the page. Always shown to the person
// for confirmation before it's saved (see the "+ บันทึกลงพอร์ต" button).
function guessPortfolioValue(text){
  const keywords = ['มูลค่ารวม','รวมทั้งหมด','พอร์ตรวม','มูลค่าพอร์ตรวม','total portfolio value','total value','net asset value','nav รวม','total assets'];
  const numRe = /[\d]{1,3}(?:,\d{3})+(?:\.\d+)?|\d{4,}(?:\.\d+)?/g;
  const lower = text.toLowerCase();
  for(const kw of keywords){
    const idx = lower.indexOf(kw);
    if(idx>=0){
      const windowText = text.slice(idx, idx+120);
      const m = windowText.match(numRe);
      if(m && m.length){
        const val = parseFloat(m[0].replace(/,/g,''));
        if(val>0) return Math.round(val);
      }
    }
  }
  const all = [...text.matchAll(numRe)].map(m=>parseFloat(m[0].replace(/,/g,''))).filter(n=>n>=1000 && n<=500000000);
  if(all.length) return Math.round(Math.max(...all));
  return null;
}
function confirmDimeImport(){
  const month = document.getElementById('dimeMonth').value || todayISO().slice(0,7);
  const value = parseFloat(document.getElementById('dimeValue').value);
  if(!value || value<=0) return;
  const existingIdx = state.assets.reports.findIndex(r=>r.month===month);
  const entry = {
    id: existingIdx>=0 ? state.assets.reports[existingIdx].id : uid(),
    month, totalValue: value,
    source: dimeParseSucceeded ? 'dime-pdf' : 'manual',
    importedAt: todayISO(), breakdown: []
  };
  if(existingIdx>=0) state.assets.reports[existingIdx] = entry; else state.assets.reports.push(entry);
  dimeParseSucceeded = false;
  saveState(); render();
}
function delAssetReport(id){ state.assets.reports = state.assets.reports.filter(r=>r.id!==id); saveState(); render(); }

/* ---------- Confirmation Note (ใบยืนยันการซื้อขาย) PDF import ----------
   Mirrors the safety pattern of the monthly Dime statement import above (handleDimePdf/
   confirmDimeImport): parse client-side with pdf.js, never auto-save, always show a
   review-before-save step. Uses pdf.js's password callback (same 8-digit-birthdate
   password scheme as the monthly statements) instead of guessing the password. */

// Loads a PDF with pdf.js, prompting for a password via window.prompt if the file needs
// one (pdf.js calls onPassword again with reason=2 if the entered password was wrong).
function loadPdfWithPassword(buf){
  return new Promise((resolve, reject)=>{
    const loadingTask = window.pdfjsLib.getDocument({
      data: buf,
      onPassword: (updatePassword, reason)=>{
        const msg = reason===2 ? 'รหัสผ่านไม่ถูกต้อง ลองใหม่ (วันเกิด 8 หลัก DDMMYYYY):' : 'ไฟล์นี้มีรหัสผ่าน — กรอกรหัสผ่าน (วันเกิด 8 หลัก DDMMYYYY):';
        const pw = window.prompt(msg);
        if(pw == null){ reject(new Error('ยกเลิกการกรอกรหัสผ่าน')); return; }
        updatePassword(pw);
      }
    });
    loadingTask.promise.then(resolve, reject);
  });
}
// pdf.js's getTextContent() returns positioned text items, not a reconstructed layout like
// pdftotext -layout would — so to get back readable "rows" (needed to match the 3-line
// OrderID/date/side/units/price block per trade) we group items by Y-coordinate (small
// tolerance for items on the same visual line) and sort each group by X.
async function extractPdfLines(pdf){
  const lines = [];
  for(let i=1;i<=pdf.numPages;i++){
    const page = await pdf.getPage(i);
    const content = await page.getTextContent();
    const items = content.items.map(it=>({str:it.str, x:it.transform[4], y:it.transform[5]})).filter(it=>it.str.trim());
    const groups = [];
    items.forEach(it=>{
      let g = groups.find(g=>Math.abs(g.y-it.y)<=2.5);
      if(!g){ g = {y: it.y, items: []}; groups.push(g); }
      g.items.push(it);
    });
    groups.sort((a,b)=>b.y-a.y); // top of page first
    groups.forEach(g=>{
      g.items.sort((a,b)=>a.x-b.x);
      lines.push(g.items.map(it=>it.str).join(' '));
    });
  }
  return lines;
}
// Matches the repeating 3-line block per trade in a confirmation note: a symbol line, the
// OrderID/date/side/units/price/currency line, and an exchange+numbers line whose LAST
// number is the total THB paid/received. One PDF can contain multiple trades, so this scans
// every line for the order line and looks one line above/below for symbol/total.
function parseConfirmationNoteLines(lines){
  const orderRe = /(\d{5,7})\s+(\d{2})\/(\d{2})\/(\d{4})\s+(BUY|SELL)\s+([\d.]+)\s+([\d.]+)\s+(USD|THB)/;
  const numRe = /\d{1,3}(?:,\d{3})*(?:\.\d+)?|\d+(?:\.\d+)?/g;
  const out = [];
  for(let i=0;i<lines.length;i++){
    const m = lines[i].match(orderRe);
    if(!m) continue;
    const [, orderId, dd, mm, yyyy, sideRaw, unitsRaw, priceRaw, currency] = m;
    const symLine = lines[i-1] || '';
    const symMatch = symLine.match(/^([A-Z]{1,6})\b/);
    const symbol = symMatch ? symMatch[1] : '';
    const totalLine = lines[i+1] || '';
    const nums = totalLine.match(numRe) || [];
    const totalTHB = nums.length ? parseFloat(nums[nums.length-1].replace(/,/g,'')) : null;
    out.push({
      symbol, date: `${yyyy}-${mm}-${dd}`, side: sideRaw.toLowerCase(),
      units: parseFloat(unitsRaw), price: parseFloat(priceRaw), currency,
      totalTHB, orderId
    });
  }
  return out;
}

// confirmationNoteRows: transient (not persisted) preview of parsed-but-not-yet-saved
// transactions, shown for human review before anything is written to state — same
// require-confirmation safety pattern as the Dime monthly-statement import above.
let confirmationNoteRows = null;
let confirmationNoteMsg = null;
async function handleConfirmationNotePdf(evt){
  const file = evt.target.files[0];
  confirmationNoteRows = null;
  if(!file) return;
  confirmationNoteMsg = '<span class="muted">กำลังอ่านไฟล์...</span>';
  render();
  try{
    await ensurePdfJs();
    const buf = await file.arrayBuffer();
    const pdf = await loadPdfWithPassword(buf);
    const lines = await extractPdfLines(pdf);
    const parsed = parseConfirmationNoteLines(lines);
    if(!parsed.length){
      confirmationNoteMsg = `<span style="color:var(--amber)">อ่านไฟล์ได้ (${pdf.numPages} หน้า) แต่ไม่พบรายการซื้อขายที่จับรูปแบบได้ — ลองตรวจไฟล์อีกครั้ง</span>`;
    } else {
      confirmationNoteRows = parsed.map(p=>({...p, checked:true}));
      confirmationNoteMsg = `<span style="color:var(--teal)">อ่านไฟล์สำเร็จ พบ ${parsed.length} รายการ — ตรวจสอบด้านล่างก่อนกดยืนยันนำเข้า</span>`;
    }
  }catch(err){
    confirmationNoteMsg = `<span style="color:var(--coral)">ไม่สามารถอ่านไฟล์นี้ได้ ลองตรวจสอบรหัสผ่านหรือรูปแบบไฟล์ (${escapeHtml(err && err.message || '')})</span>`;
  }
  render();
}
// Review-before-save table — every parsed row gets a checkbox (checked by default) and an
// editable symbol field, since OCR/layout parsing can occasionally get the symbol wrong.
// Rows whose symbol doesn't match any existing holding are flagged and simply skipped on
// confirm (this import path is additive-only to existing holdings, never creates new items).
function renderConfirmationNoteReview(){
  if(!confirmationNoteRows || !confirmationNoteRows.length) return '';
  const rows = confirmationNoteRows;
  return `
  <div class="panel">
    <h3>ตรวจสอบก่อนนำเข้า (${rows.length} รายการ)</h3>
    <table class="table">
      <tr><th></th><th>วันที่</th><th>Symbol</th><th>ฝั่ง</th><th style="text-align:right">จำนวนหน่วย</th><th style="text-align:right">ราคา</th><th style="text-align:right">รวม (THB)</th><th></th></tr>
      ${rows.map((r,i)=>{
        const matched = state.assets.items.some(it=>String(it.symbol||'').toUpperCase()===String(r.symbol||'').toUpperCase());
        return `<tr>
          <td><input type="checkbox" id="cnRow_${i}" ${r.checked?'checked':''}></td>
          <td class="mono">${fmtDate(r.date)}</td>
          <td><input type="text" id="cnSym_${i}" value="${escapeHtml(r.symbol)}" style="max-width:80px" class="mono"></td>
          <td><span class="tag" style="background:${r.side==='buy'?'var(--teal-pale)':'var(--coral-pale)'}; color:${r.side==='buy'?'var(--teal)':'var(--coral)'}">${r.side==='buy'?'ซื้อ':'ขาย'}</span></td>
          <td style="text-align:right" class="mono">${r.units}</td>
          <td style="text-align:right" class="mono">${r.price} ${r.currency}</td>
          <td style="text-align:right" class="mono">฿${fmtMoney(r.totalTHB)}</td>
          <td>${matched ? '' : '<span style="font-size:11px; color:var(--coral)">ไม่พบสินทรัพย์ที่ถือครองอยู่ตรงกับสัญลักษณ์นี้ — ข้าม</span>'}</td>
        </tr>`;
      }).join('')}
    </table>
    <div class="form-row" style="margin-top:12px">
      <button class="btn" onclick="confirmConfirmationNoteImport()">ยืนยันนำเข้า</button>
      <button class="btn btn-ghost" onclick="cancelConfirmationNoteImport()">ยกเลิก</button>
    </div>
  </div>`;
}
function confirmConfirmationNoteImport(){
  if(!confirmationNoteRows) return;
  let imported = 0, skipped = 0;
  confirmationNoteRows.forEach((r,i)=>{
    const cb = document.getElementById('cnRow_'+i);
    if(!cb || !cb.checked) return;
    const symInput = document.getElementById('cnSym_'+i);
    const symbol = (symInput ? symInput.value : r.symbol).trim();
    const item = state.assets.items.find(it=>String(it.symbol||'').toUpperCase()===symbol.toUpperCase());
    if(!item){ skipped++; return; }
    if(!item.transactions) item.transactions = [];
    item.transactions.push({
      id: uid(), date: r.date, side: r.side, units: r.units, price: r.price,
      currency: r.currency, totalTHB: r.totalTHB, orderId: r.orderId, source: 'confirmation-pdf'
    });
    imported++;
  });
  confirmationNoteRows = null;
  confirmationNoteMsg = `<span style="color:var(--teal)">นำเข้า ${imported} รายการ${skipped ? ` (ข้าม ${skipped} รายการที่ไม่พบสินทรัพย์ตรงกัน)` : ''}</span>`;
  saveState();
  render();
}
function cancelConfirmationNoteImport(){ confirmationNoteRows = null; render(); }
function addAssetItem(){
  const name = document.getElementById('assetName').value.trim();
  const category = document.getElementById('assetCategory').value;
  const note = document.getElementById('assetNote').value.trim();
  const value = parseFloat(document.getElementById('assetValue').value);

  if(!name || !value) return;
  const today = todayISO();
  state.assets.items.push({id:uid(), name, category, assetType:'', value, costBasis, note, updated: today, transactions:[], valueHistory:[{date:today, value}]});
  document.getElementById('assetName').value = '';
  document.getElementById('assetValue').value = '';
  document.getElementById('assetCostBasis').value = '';

}
function delAssetItem(id){ state.assets.items = state.assets.items.filter(x=>x.id!==id); if(openItemChartId===id) openItemChartId = null; saveState(); render(); }
// Manual "อัพเดทมูลค่า" action — the only way this app's asset values ever change over
// time (no live market feed). Overwrites today's valueHistory entry instead of stacking
// a duplicate if this item was already updated once today.
function updateAssetItemValue(id){
  const input = document.getElementById('assetVal_'+id);
  if(!input) return;
  const v = parseFloat(input.value);
  if(!(v>=0)) return;
  const it = state.assets.items.find(x=>x.id===id);
  if(!it) return;
  it.value = v;
  it.updated = todayISO();
  if(!it.valueHistory) it.valueHistory = [];
  const today = todayISO();
  if(it.valueHistory.length && it.valueHistory[it.valueHistory.length-1].date === today){
    it.valueHistory[it.valueHistory.length-1].value = v;
  } else {
    it.valueHistory.push({date: today, value: v});
  }
  saveState(); render();
}
// Live market-price refresh for stocks/ETFs. Uses Finnhub's free quote endpoint (needs a
// user-supplied API key, see Settings) for the price and Frankfurter's free no-key FX API
// for USD→THB, fetched once per batch and reused across all USD items. Only items with both
// `symbol` and `units` set are eligible — everything else keeps working via the manual
// "อัพเดทมูลค่า" flow untouched. Mirrors the exact same-day valueHistory de-dup convention as
// updateAssetItemValue() so history doesn't grow a duplicate entry per refresh in one day.
async function refreshLivePrices(){
  const key = state.settings.finnhubApiKey;
  if(!key){
    livePriceMsg = {ok:false, html:`<div class="msg msg-err">ยังไม่ได้ใส่ Finnhub API key — ไปที่หน้า "ตั้งค่า" ก่อน</div>`};
    render();
    return;
  }
  const eligible = state.assets.items.filter(it=>it.symbol && it.units);
  if(!eligible.length){
    livePriceMsg = {ok:false, html:`<div class="muted">ยังไม่มีสินทรัพย์ที่ตั้งค่า symbol/units ไว้สำหรับดึงราคาสด</div>`};
    render();
    return;
  }
  livePriceMsg = {ok:true, html:`<div class="muted">กำลังดึงราคาตลาด...</div>`};
  render();

  let fxRate = null;
  if(eligible.some(it=>it.currency==='USD')){
    try{
      const fxRes = await fetch('https://api.frankfurter.app/latest?from=USD&to=THB');
      if(fxRes.ok){
        const fxData = await fxRes.json();
        fxRate = fxData && fxData.rates ? Number(fxData.rates.THB) : null;
      }
    }catch(e){ fxRate = null; }
  }

  const today = todayISO();
  let ok = 0, fail = 0;
  for(const it of eligible){
    try{
      if(it.currency === 'USD' && !fxRate) throw new Error('no fx rate');
      const res = await fetch(`https://finnhub.io/api/v1/quote?symbol=${encodeURIComponent(it.symbol)}&token=${encodeURIComponent(key)}`);
      if(!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      const price = Number(data && data.c);
      if(!(price>0)) throw new Error('no price');
      const value = Math.round(it.currency === 'USD' ? it.units * price * fxRate : it.units * price);
      it.value = value;
      it.updated = today;
      if(!it.valueHistory) it.valueHistory = [];
      if(it.valueHistory.length && it.valueHistory[it.valueHistory.length-1].date === today){
        it.valueHistory[it.valueHistory.length-1].value = value;
      } else {
        it.valueHistory.push({date: today, value});
      }
      ok++;
    }catch(e){ fail++; }
  }
  saveState();
  livePriceMsg = fail
    ? {ok:false, html:`<div class="msg msg-err">อัพเดท ${ok}/${eligible.length} รายการ — ${fail} รายการดึงราคาไม่สำเร็จ</div>`}
    : {ok:true, html:`<div class="msg msg-ok">อัพเดทราคาตลาดสำเร็จ ${ok}/${eligible.length} รายการ</div>`};
  render();
}
function addDebt(){
  const name = document.getElementById('debtName').value.trim();
  const amount = parseFloat(document.getElementById('debtAmount').value);
  const note = document.getElementById('debtNote').value.trim();
  if(!name || !amount) return;
  state.assets.debts.push({id:uid(), name, amount, note});
  saveState(); render();
}
function delDebt(id){ state.assets.debts = state.assets.debts.filter(d=>d.id!==id); saveState(); render(); }

function saveIntervalsSettings(){
  state.settings.intervalsApiKey = document.getElementById('intervalsKey').value.trim();
  state.settings.intervalsAthleteId = document.getElementById('intervalsAthlete').value.trim() || '0';
  saveState(); render();

  saveState(); render();
}

  saveState(); render();
}
function saveFhbSettings(){

}
function exportAllJson(){
  const blob = new Blob([JSON.stringify(state, null, 2)], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'milk-life-os-export-' + todayISO() + '.json';
  a.click();
}
function importAllJson(evt){
  const file = evt.target.files[0];
  const msgEl = document.getElementById('allImportMsg');
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const parsed = JSON.parse(e.target.result);
      const required = ['finance','running','work','trips','settings'];
      if(!parsed.assets) parsed.assets = {items:[], reports:[]}; // older backups won't have this yet
      if(!parsed.assets.debts) parsed.assets.debts = []; // older backups predate liabilities tracking
      (parsed.assets.items||[]).forEach(it=>{
        if(!it.category) it.category = 'other';
        if(it.costBasis == null) it.costBasis = 0;
        if(!it.valueHistory) it.valueHistory = [{date: it.updated || todayISO(), value: Number(it.value)||0}];
      });
      if(!parsed.calendar) parsed.calendar = {events:[]};
      delete parsed.health; // module removed — drop it if an old backup still has it
      const looksValid = required.every(k=>Object.prototype.hasOwnProperty.call(parsed, k));
      if(!looksValid) throw new Error('ไฟล์นี้ไม่ใช่ backup ของ Life OS (โครงสร้างไม่ตรง)');
      if(!confirm('Import จะแทนที่ข้อมูลทั้งหมดในเบราว์เซอร์นี้ด้วยข้อมูลจากไฟล์ที่เลือก ดำเนินการต่อ?')) {
        evt.target.value = '';
        return;
      }
      state = parsed;
      saveState();
      msgEl.innerHTML = `<div class="msg msg-ok">Import สำเร็จ — โหลดข้อมูลจากไฟล์เรียบร้อย</div>`;
      render();
    }catch(err){
      msgEl.innerHTML = `<div class="msg msg-err">อ่านไฟล์ไม่ได้ — ตรวจสอบว่าเป็นไฟล์ backup JSON ที่ export จากหน้านี้ ข้อผิดพลาด: ${escapeHtml(err.message)}</div>`;
    }
    evt.target.value = '';
  };
  reader.readAsText(file);
}
function resetAll(){
  if(!confirm('ลบข้อมูลทั้งหมดในเครื่องนี้และเริ่มใหม่ด้วยข้อมูลตัวอย่าง?')) return;
  state = defaultState();
  saveState(); render();
}

/* ---------- Init ---------- */
render();
